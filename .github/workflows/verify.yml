name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run backend unit tests
        run: mvn -q test

  mysql-integration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test-password
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -ptest-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Initialize isolated test database
        run: sed 's/`smart_dormitory`/`codex_dorm_it_123abc`/g' sql/smart_dormitory.sql | docker exec -i ${{ job.services.mysql.id }} mysql -uroot -ptest-password --default-character-set=utf8mb4
      - name: Test concurrent workflows with MySQL
        working-directory: backend
        env:
          DORM_INTEGRATION_TEST: 'true'
          DB_USER: root
          DB_PWD: test-password
          SPRING_DATASOURCE_URL: 'jdbc:mysql://localhost:3306/codex_dorm_it_123abc?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true'
        run: mvn -q -Dtest=MySqlWorkflowIntegrationTest test

  frontend-student:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-student
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run student tests
        run: node --test src/*.test.js
      - run: npm ci
      - run: npm run build

  frontend-admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node --test src/*.test.js
      - run: npm ci
      - run: npm run build

  miniprogram-and-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run miniprogram tests
        run: node --test miniprogram-student/tests/*.test.js
      - name: Run configure scripts tests
        run: node --test scripts/*.test.js
