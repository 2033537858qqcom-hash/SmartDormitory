server:
  port: 7000

spring:
  servlet:
    multipart:
      max-file-size: 3MB
      max-request-size: 10MB
  application:
    name: smart-dormitory-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/smart_dormitory?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PWD:123456}
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

app:
  upload-dir: uploads

alipay:
  enabled: ${ALIPAY_ENABLED:false}
  app-id: ${ALIPAY_APP_ID:}
  private-key: ${ALIPAY_PRIVATE_KEY:}
  alipay-public-key: ${ALIPAY_PUBLIC_KEY:}
  gateway-host: ${ALIPAY_GATEWAY:openapi-sandbox.dl.alipaydev.com}
  protocol: https
  sign-type: RSA2
  notify-url: ${ALIPAY_NOTIFY_URL:http://localhost:7000/api/utility/pay/alipay-notify}
  return-url: ${ALIPAY_RETURN_URL:http://localhost:5174}
